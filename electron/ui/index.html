<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'none'; object-src 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>拾集 · 媒体采集</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="brandbar"><div class="brand"><span class="brandmark">拾</span><strong>拾集</strong><span class="brand-caption">边浏览，边收集。</span></div><div class="stage">第一阶段 <span>·</span> YouTube / B站 / 小红书</div></header>
<nav class="toolbar"><div class="history"><button id="back" title="后退">←</button><button id="forward" title="前进">→</button><button id="reload" title="刷新">↻</button></div><form id="address-form"><span class="address-icon">⌕</span><input id="address" aria-label="网页地址" placeholder="输入网页地址，或从下方选择网站" autocomplete="off"><button type="submit">前往</button></form><button id="parse" class="primary">解析当前页面</button></nav>
<main><section class="browser-area"><div class="sitebar"><button data-site="youtube">YouTube <span data-site-count="youtube">1</span></button><button data-site="bilibili">B站 <span data-site-count="bilibili">0</span></button><button data-site="xiaohongshu">小红书 <span data-site-count="xiaohongshu">0</span></button><span id="page-status">开始浏览</span></div><div class="browser-tabbar"><div id="browser-tabs" role="tablist" aria-label="当前站点的标签页"></div><button id="new-tab" title="在当前站点新建标签页" aria-label="新建标签页">＋</button></div><div id="browser-slot"></div></section>
<aside><div class="panel-heading"><div><div class="eyebrow">CURRENT PAGE</div><h1>页面采集</h1></div><span id="site-label" class="badge">等待页面</span></div>
<div class="tabs" role="tablist" aria-label="采集面板"><button id="resources-tab" class="active" role="tab" aria-controls="resources-panel" aria-selected="true">资源</button><button id="tasks-tab" role="tab" aria-controls="tasks-panel" aria-selected="false">下载任务 <span id="task-count">0</span></button><button id="settings-tab" role="tab" aria-controls="settings-panel" aria-selected="false">设置</button></div>
<div id="notice" role="status" hidden></div><button id="required-login" class="required-login" hidden>通过 Edge 登录 YouTube</button>
<section id="resources-panel" role="tabpanel" aria-labelledby="resources-tab"><div class="login-card"><h2>账号登录</h2><div class="login-tools"><button id="web-login">登录</button><button id="edge-login">Edge登录</button><button id="import-login" title="读取旧版工具保存在本机的本站点 Cookies">导入Cookies</button></div><div class="login-row"><span id="login-state" role="status">登录状态由当前网站管理</span><button id="cancel-login" class="text-button" hidden>取消登录</button></div><p class="login-help">可在左侧网页登录，或通过 Edge 登录。导入 Cookies 会读取旧版工具保存的本站凭据。</p></div><div id="resources"></div><details class="parse-logs"><summary>解析日志</summary><pre id="parse-log"></pre></details></section>
<section id="tasks-panel" role="tabpanel" aria-labelledby="tasks-tab" hidden><div class="section-row"><span class="muted">切换网页不会中断下载</span><button id="open-folder" class="text-button">打开保存目录 ↗</button></div><div id="tasks"></div></section>
<section id="settings-panel" role="tabpanel" aria-labelledby="settings-tab" hidden><h2>采集设置</h2><label>保存位置<div class="folder-row"><input id="save-dir" readonly><button id="choose-folder">选择</button></div></label><label>代理地址<input id="proxy" placeholder="留空使用系统设置"></label><label>图片保存格式<select id="image-format"><option value="original">保留原始格式</option><option value="jpg">统一为 JPG</option><option value="png">统一为 PNG（无损）</option><option value="webp">统一为 WebP</option></select></label><label class="check"><input id="auto-parse" type="checkbox"><span>打开内容页面后自动解析</span></label><button id="save-settings" class="primary">保存设置</button><p id="health-detail" class="muted"></p></section>
<div class="panel-foot"><span class="status-dot"></span><span id="core-status">正在连接下载核心…</span></div></aside></main>
<footer><span>浏览 · 选择 · 保存</span><span>素材保存在本机</span></footer><script src="media-info.js"></script><script src="app.js"></script></body></html>
