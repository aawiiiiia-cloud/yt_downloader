<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'none'; object-src 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>拾集 · 媒体采集</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="brandbar"><div class="brand"><span class="brandmark">拾</span><strong>拾集</strong><span class="brand-caption">边浏览，边收集。</span></div><div class="stage">第一阶段 <span>·</span> YouTube / B站 / 小红书</div><button id="settings-toggle" class="quiet">设置</button></header>
<nav class="toolbar"><div class="history"><button id="back" title="后退">←</button><button id="forward" title="前进">→</button><button id="reload" title="刷新">↻</button></div><form id="address-form"><span class="address-icon">⌕</span><input id="address" aria-label="网页地址" placeholder="输入网页地址，或从下方选择网站" autocomplete="off"><button type="submit">前往</button></form><button id="parse" class="primary">解析当前页面</button></nav>
<main><section class="browser-area"><div class="sitebar"><button data-site="youtube">YouTube</button><button data-site="bilibili">B站</button><button data-site="xiaohongshu">小红书</button><span id="page-status">开始浏览</span></div><div id="browser-slot"></div></section>
<aside><div class="panel-heading"><div><div class="eyebrow">CURRENT PAGE</div><h1>页面采集</h1></div><span id="site-label" class="badge">等待页面</span></div>
<div class="tabs"><button id="resources-tab" class="active">资源</button><button id="tasks-tab">下载任务 <span id="task-count">0</span></button></div>
<div id="settings-panel" hidden><h2>采集设置</h2><label>保存位置<div class="folder-row"><input id="save-dir" readonly><button id="choose-folder">选择</button></div></label><label>代理地址<input id="proxy" placeholder="留空使用系统设置"></label><label>图片保存格式<select id="image-format"><option value="original">保留原始格式</option><option value="jpg">统一为 JPG</option><option value="png">统一为 PNG（无损）</option><option value="webp">统一为 WebP</option></select></label><label class="check"><input id="auto-parse" type="checkbox">打开内容页面后自动解析</label><button id="save-settings" class="primary">保存设置</button><p id="health-detail" class="muted"></p></div>
<div id="notice" role="status" hidden></div>
<section id="resources-panel"><div class="login-row"><span id="login-state">登录状态由当前网站管理</span><button id="web-login" class="text-button">网页登录</button></div><div class="login-tools"><button id="edge-login">Edge 备用登录</button><button id="import-login">导入旧版登录</button><button id="cancel-login" hidden>取消登录</button></div><p class="login-help">可直接在左侧网页登录；下载时会同步该站点的登录状态。</p><div id="resources"></div><details class="parse-logs"><summary>解析日志</summary><pre id="parse-log"></pre></details></section>
<section id="tasks-panel" hidden><div class="section-row"><span class="muted">切换网页不会中断下载</span><button id="open-folder" class="text-button">打开保存目录 ↗</button></div><div id="tasks"></div></section>
<div class="panel-foot"><span class="status-dot"></span><span id="core-status">正在连接下载核心…</span></div></aside></main>
<footer><span>浏览 · 选择 · 保存</span><span>素材保存在本机</span></footer><script src="app.js"></script></body></html>
