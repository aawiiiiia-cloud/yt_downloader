<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'none'; object-src 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>media-dl</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav class="toolbar"><div class="history"><button id="back" title="后退">←</button><button id="forward" title="前进">→</button><button id="reload" title="刷新">↻</button></div><form id="address-form"><span class="address-icon">⌕</span><input id="address" aria-label="网页地址" placeholder="输入网页地址，或从下方选择网站" autocomplete="off"><button type="submit">前往</button></form></nav>
<main id="workspace"><section id="browser-area" class="browser-area"><div class="sitebar"><div class="site-links" aria-label="站点分组"><button data-site="youtube">YouTube <span data-site-count="youtube">1</span></button><button data-site="bilibili">B站 <span data-site-count="bilibili">0</span></button><button data-site="xiaohongshu">小红书 <span data-site-count="xiaohongshu">0</span></button><button data-site="vimeo">Vimeo <span data-site-count="vimeo">0</span></button><button data-site="douyin">抖音 <span data-site-count="douyin">0</span></button><button data-site="behance">Behance <span data-site-count="behance">0</span></button><button data-site="taobao" title="淘宝、天猫、天猫超市商品图片">淘宝 <span data-site-count="taobao">0</span></button><button data-site="zcool" title="站酷作品图片">站酷 <span data-site-count="zcool">0</span></button></div><span id="page-status">开始浏览</span></div><div class="browser-tabbar"><div id="browser-tabs" role="tablist" aria-label="当前站点的标签页"></div><button id="new-tab" title="在当前站点新建标签页" aria-label="新建标签页"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" focusable="false"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div><div id="browser-slot"></div></section>
<div id="pane-divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="调整浏览区域与解析区域宽度" aria-controls="browser-area collection-pane" aria-valuemin="330" aria-valuemax="996" aria-valuenow="390" title="拖动调整宽度，双击恢复默认；方向键微调"></div>
<aside id="collection-pane"><div class="panel-heading"><div><div class="eyebrow">CURRENT PAGE</div><div class="panel-title"><h1>页面采集</h1><span id="site-label" class="badge">等待页面</span></div></div><button id="parse" class="primary">解析当前页面</button></div>
<div class="tabs" role="tablist" aria-label="采集面板"><button id="resources-tab" class="active" role="tab" aria-controls="resources-panel" aria-selected="true">资源</button><button id="tasks-tab" role="tab" aria-controls="tasks-panel" aria-selected="false">下载任务 <span id="task-count">0</span></button><button id="settings-tab" role="tab" aria-controls="settings-panel" aria-selected="false">设置</button></div>
<div id="notice" role="status" hidden></div><button id="required-login" class="required-login" hidden>通过 Edge 登录 YouTube</button>
<section id="resources-panel" role="tabpanel" aria-labelledby="resources-tab"><div class="login-card"><div class="login-heading"><h2>账号登录</h2><span id="login-state" role="status">正在检查登录状态…</span></div><div class="login-tools external-login-only"><button id="web-login" hidden>登录</button><button id="edge-login">Edge登录</button><button id="import-login" title="选择当前站点的 Netscape 格式 Cookies 文本文件">导入Cookies</button></div><button id="cancel-login" class="text-button" hidden>取消登录</button><p class="login-help">选择当前站点的 Netscape 格式 Cookies 文件（.txt）导入。</p></div><div id="resources"></div><details class="parse-logs"><summary>解析日志</summary><pre id="parse-log"></pre></details></section>
<section id="tasks-panel" role="tabpanel" aria-labelledby="tasks-tab" hidden><div class="section-row task-toolbar"><span class="muted">切换网页不会中断下载</span><div class="task-tools"><button id="clear-history" class="text-button" title="清除已完成、失败和已取消的任务记录；保留下载中及排队任务，不删除本地文件。" disabled>清除记录</button><button id="open-folder" class="text-button">打开保存目录 ↗</button></div></div><div id="tasks"></div></section>
<section id="settings-panel" role="tabpanel" aria-labelledby="settings-tab" hidden><h2>采集设置</h2><label>保存位置<div class="folder-row"><input id="save-dir" readonly><button id="choose-folder">选择</button></div></label><label>代理地址<input id="proxy" placeholder="留空使用系统设置"></label><label>图片保存格式<select id="image-format"><option value="original">保留原始格式</option><option value="jpg">统一为 JPG</option><option value="png">统一为 PNG（无损）</option><option value="webp">统一为 WebP</option></select></label><label class="check"><input id="auto-parse" type="checkbox"><span>打开内容页面后自动解析</span></label><p id="auto-parse-help" class="muted auto-parse-help">关闭后保留上次结果，手动解析才更新。</p>
<details id="advanced-options" class="advanced-options"><summary>高级选项</summary><div class="concurrency-fields"><label>全局并发<input id="global-concurrency" type="number" min="1" max="20" step="1" value="5" required aria-describedby="concurrency-help"></label><label>单站并发<input id="site-concurrency" type="number" min="1" max="20" step="1" value="1" required aria-describedby="concurrency-help"></label></div><p id="concurrency-help" class="muted">可填写 1–20，单站上限对每个网站分别生效。超过上限的任务会排队；调低上限不打断正在下载的任务。</p></details>
<button id="save-settings" class="primary">保存设置</button><p id="health-detail" class="muted"></p></section>
<div class="panel-foot"><span class="status-dot"></span><span id="core-status">正在连接下载核心…</span></div></aside></main>
<script src="media-info.js"></script><script src="split-pane.js"></script><script src="task-progress.js"></script>
<script src="download-feedback.js"></script><script src="app.js"></script></body></html>
